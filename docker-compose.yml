services:
  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    networks:
      - internal-net
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/version')"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      WORKER_URL: http://worker:8000
      IMAGE_UPLOAD_ENABLED: ${IMAGE_UPLOAD_ENABLED:-false}
      RENDER_TIMEOUT_SECONDS: ${RENDER_TIMEOUT_SECONDS:-30}
    networks:
      - default
      - internal-net
    depends_on:
      worker:
        condition: service_healthy
    restart: unless-stopped

networks:
  internal-net:
    internal: true
