# Deployment variant: pulls pre-built images from GHCR instead of building
# locally. Use this for a Dockhand/TrueNAS-style deployment where the
# compose file is run on a machine that doesn't have the source checked out.
#
# Pin to a specific released version instead of `latest` for reproducible
# deploys, e.g. ghcr.io/jfmilke/rendercv-web-backend:0.1.0
#
# For local development, use docker-compose.yml instead (builds from source).

services:
  worker:
    image: ghcr.io/jfmilke/rendercv-web-worker:latest
    environment:
      RENDER_TIMEOUT_SECONDS: ${RENDER_TIMEOUT_SECONDS:-30}
    networks:
      - internal-net
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/version')"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  backend:
    image: ghcr.io/jfmilke/rendercv-web-backend:latest
    ports:
      - "8000:8000"
    environment:
      WORKER_URL: http://worker:8000
      IMAGE_UPLOAD_ENABLED: ${IMAGE_UPLOAD_ENABLED:-false}
      RENDER_TIMEOUT_SECONDS: ${RENDER_TIMEOUT_SECONDS:-30}
    # Container-level safety net only. Image uploads are deliberately uncapped
    # per-request (design decision); this bounds the container as a whole.
    mem_limit: 1g
    networks:
      - default
      - internal-net
    depends_on:
      worker:
        condition: service_healthy
    restart: unless-stopped

networks:
  internal-net:
    internal: true
